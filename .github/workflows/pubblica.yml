# Pubblica l'app su Firebase (cappu-events.web.app) a ogni modifica del ramo main.
# Usa la chiave dell'account di servizio salvata nel secret FIREBASE_SERVICE_ACCOUNT.
name: Pubblica su Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila l'app
        run: npm run build

      - name: Prepara le credenziali
        env:
          CHIAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$CHIAVE" > "$RUNNER_TEMP/chiave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chiave.json" >> "$GITHUB_ENV"

      - name: Pubblica app e regole di sicurezza
        run: |
          set -o pipefail
          if ! npx firebase deploy --only hosting,firestore:rules --project cappu-events --non-interactive 2>&1 | tee "$RUNNER_TEMP/esito.txt"; then
            # Riporta l'errore anche come annotazione, visibile nel riepilogo della pubblicazione.
            grep -v '^\s*$' "$RUNNER_TEMP/esito.txt" | tail -n 12 | while IFS= read -r riga; do echo "::error::$riga"; done
            exit 1
          fi

      - name: Cancella le credenziali
        if: always()
        run: rm -f "$RUNNER_TEMP/chiave.json"
