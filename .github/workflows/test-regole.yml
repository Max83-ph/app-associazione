# Verifica le regole di sicurezza sull'emulatore Firestore (nessun accesso ai dati reali).
name: Test regole

on:
  pull_request:
  push:
    paths: ['firestore.rules', 'test/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
      - name: Esegui i test
        run: |
          set -o pipefail
          if ! npx firebase emulators:exec --only firestore --project demo-regole "node --test --test-reporter=spec test/regole.test.mjs" 2>&1 | tee "$RUNNER_TEMP/esito.txt"; then
            grep -E "✖|not ok|Error|error|expected|at .*test" "$RUNNER_TEMP/esito.txt" | head -n 40 | while IFS= read -r riga; do echo "::error::$riga"; done
            exit 1
          fi
